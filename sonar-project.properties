# SonarCloud project configuration for platform-tools
# See https://docs.sonarsource.com/sonarcloud/advanced-setup/analysis-parameters/

sonar.projectKey=SaravananP-takeda_platform-tools
# sonar.organization is intentionally not set here: the placeholder value
# previously hardcoded in this file did not match any real SonarCloud
# organization and caused every scan to fail with "Organization key ...
# does not exist". It is now supplied at scan time via the
# SONAR_ORGANIZATION repository variable (see .github/workflows/sonarcloud.yml
# and README.md).
sonar.projectName=platform-tools

sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclude Git/CI metadata, docs, and virtual environments from analysis
sonar.exclusions=.github/**,**/*.md,.venv/**,venv/**,**/__pycache__/**
