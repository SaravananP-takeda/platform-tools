name: SonarCloud

on:
  push:
    branches:
      - copilot/build-enterprise-copilot-streamlit
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    # Skip until the repository is configured with a real SonarCloud
    # organization key. Set the SONAR_ORGANIZATION repository variable
    # (Settings -> Secrets and variables -> Actions -> Variables) to the
    # organization key confirmed in SonarCloud to enable this job.
    if: vars.SONAR_ORGANIZATION != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
